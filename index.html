<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<style>
:root{--bg:#EEF3F5;--card:#fff;--ink:#16262E;--muted:#5B6F7A;--line:#D5E0E5;--accent:#0E7C86;--accent-soft:#DDF0F2;--note:#FFF4D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 20px;overflow-x:auto}
.brand{font:600 18px Georgia,serif;padding:14px 0;white-space:nowrap}
nav{display:flex;gap:2px}
nav a{color:#B9CBD3;text-decoration:none;padding:16px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a:hover{color:#fff}
nav a.on{color:#fff;border-bottom-color:#4FC3CE}
nav a:focus-visible,textarea:focus-visible{outline:3px solid #4FC3CE;outline-offset:-3px}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
h1{font:600 30px Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h2{font-size:17px;margin:0 0 8px}
.empty{color:var(--muted);margin:0;font-size:15px}
.note{background:var(--note);border-color:#EBD58E;grid-column:1/-1}
.note textarea{width:100%;border:1px solid #EBD58E;border-radius:6px;padding:10px;font:inherit;background:#fff;resize:vertical;min-height:60px}
.saved{font-size:13px;color:var(--muted);margin:6px 0 0;min-height:20px}
.later{max-width:520px}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}
.form label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.form input,.form select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.form .t{flex:1 1 240px}.form .t input{width:100%}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
button:hover{background:#0A6169}button.x{background:none;color:var(--muted);padding:4px 8px}button.x:hover{color:#B3261E;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4FC3CE;outline-offset:1px}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:0}
ul.tasks input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.tt{flex:1}.meta{font-size:13px;color:var(--muted)}
.over .meta{color:#B3261E;font-weight:600}
.pill{font-size:12px;border-radius:10px;padding:1px 8px;background:var(--accent-soft);color:#0A5A62}
.pill.High{background:#FBE0DD;color:#8C1D18}.pill.Low{background:#E8EDEF;color:var(--muted)}
.done li{opacity:.6;text-decoration:line-through}
.cal{overflow-x:auto}.cg{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));min-width:770px;border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}
.ch{padding:6px 8px;font-size:13px;color:var(--muted);background:var(--accent-soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cd{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}
.cd.out{background:#F6F9FA;color:#9AAAB2}.cd.now{background:#EAF7F8}
.cd b{display:block;font-weight:600;margin-bottom:2px}.cd.now b{color:var(--accent)}
.ev,.tk{padding:1px 5px;border-radius:4px;margin-bottom:2px;overflow-wrap:anywhere}
.ev{background:var(--accent);color:#fff}.tk{background:#FFF4D6;border-left:3px solid #D9A400;color:#5A4500}.tk.od{background:#FBE0DD;border-left-color:#B3261E;color:#8C1D18}
.tools{display:flex;gap:8px;align-items:center;margin:14px 0}.tools h2{flex:1;margin:0;font-size:19px}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}button.alt:hover{background:var(--accent-soft)}button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend{font-size:13px;color:var(--muted)}
.bk{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.bk textarea{width:100%;min-height:110px;font:13px monospace;border:1px solid var(--line);border-radius:6px;padding:8px}
.card p{margin:6px 0}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.col i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.col.now i{background:#0A5A62}.col span{margin-top:3px}
.pie{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.leg{list-style:none;margin:0;padding:0;font-size:14px;flex:1;min-width:170px}
.leg li{display:flex;gap:8px;align-items:center;padding:2px 0}.leg b{margin-left:auto;font-weight:600}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.tile small{display:block;color:var(--muted);font-size:13px}.tile strong{font:600 24px Georgia,serif}
.tile.left{background:var(--accent-soft);border-color:#A9D8DC}.neg{color:#B3261E}
.pf{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;margin-bottom:16px}
@media(max-width:800px){.pf{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}td.n,th.n{text-align:right}
td input{width:96px;font:inherit;padding:5px;border:1px solid var(--line);border-radius:6px;text-align:right}
.pos{color:#1B7A3E}
.rd{font-size:10px;font-weight:600;background:#7FB3A0;color:#fff;border-radius:3px;padding:0 4px;margin-bottom:2px}
h3{font-size:15px;color:var(--muted);margin:22px 0 6px}

/* phone fixes */
body{overflow-x:hidden}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.tools{flex-wrap:wrap}
.form label{min-width:0}
.form input,.form select{min-width:0;max-width:100%}
@media(max-width:600px){
  main{padding:20px 14px 50px}
  .bar{gap:12px;padding:0 14px}
  nav a{padding:16px 10px}
  h1{font-size:26px}
  .tools h2{flex:1 1 100%}
  .tools button{flex:1 1 auto;padding:9px 10px}
  .form{gap:8px}
  .form label{flex:1 1 130px}
  .form .t{flex:1 1 100%}
  .form button[type=submit]{flex:1 1 100%}
  .form input,.form select{width:100%!important}
  .sum{gap:8px}
  .tile{padding:10px}
  .tile strong{font-size:17px;overflow-wrap:anywhere}
  .tile small{font-size:12px}
  .card{padding:14px}
}

.seg{display:flex;gap:8px}
@media(max-width:600px){
  .tools .seg{flex:1 1 100%}
  .tools .seg button{flex:1}
  .cal{overflow-x:visible}
  .cg{grid-template-columns:repeat(7,minmax(0,1fr));min-width:0}
  .ch{padding:4px 2px;font-size:11px;text-align:center}
  .cd{min-height:64px;padding:2px;font-size:11px;min-width:0}
  .cd b{font-size:12px;text-align:center}
  .ev,.tk{font-size:10px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* overlap fixes */
[hidden]{display:none!important}
ul.tasks li{min-width:0}
ul.tasks li>.tt{flex:1 1 0;min-width:0;overflow-wrap:anywhere}
ul.tasks li>input[type=checkbox],ul.tasks li>.pill,ul.tasks li>button,ul.tasks li>b{flex:none}
ul.tasks li>.pill{white-space:nowrap}
@media(max-width:600px){
  ul.tasks li{gap:8px}
  button.x{padding:4px 6px}
  .form label,.form button[type=submit]{min-width:0}
  .tools{gap:8px}
  .cd b{margin-bottom:1px}
  .cd{overflow:hidden}
}

/* calendar button row: cannot overflow */
.tools{max-width:100%}
.tools>*{min-width:0}
@media(max-width:900px){
  .tools .seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;flex:1 1 100%;width:100%;max-width:100%}
  .tools .seg button{width:100%;min-width:0;padding:9px 4px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools h2{flex:1 1 100%}
}

/* money tiles: cannot overflow */
.sum{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{min-width:0}
.tile strong{display:block;overflow-wrap:anywhere}
.card b,.card small{overflow-wrap:anywhere}
@media(max-width:600px){
  .tile strong{font-size:15px}
  .tile{padding:10px 8px}
}

/* Tasks + Calendar forms only: no overlapping fields on phones */
@media(max-width:900px){
  #tf,#af{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
  #tf label,#af label{min-width:0;flex:none}
  #tf .t,#af .t,#tf button[type=submit],#af button[type=submit]{grid-column:1/-1}
  #tf input,#tf select,#af input,#af select{box-sizing:border-box;width:100%!important;min-width:0;max-width:100%}
  #tf input[type=date],#af input[type=date],#af input[type=time]{-webkit-appearance:none;appearance:none;min-height:38px}
}

/* Time form only: no overlapping fields on phones */
@media(max-width:900px){
  #tmf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
  #tmf label{min-width:0;flex:none}
  #tmf .t,#tmf #tnl2,#tmf button[type=submit]{grid-column:1/-1}
  #tmf input,#tmf select{box-sizing:border-box;width:100%!important;min-width:0;max-width:100%}
  #tmf input[type=date]{-webkit-appearance:none;appearance:none;min-height:38px}
}

/* multi-day events */
.sp{position:relative;z-index:1;box-sizing:border-box;height:18px;line-height:18px;padding:0 7px;margin-bottom:2px;background:var(--accent);color:#fff;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sp.cl{margin-left:-5px;padding-left:12px;border-top-left-radius:0;border-bottom-left-radius:0}
.sp.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.sp0{height:18px;margin-bottom:2px}
@media(max-width:600px){
  .sp,.sp0{height:15px;line-height:15px}
  .sp{font-size:10px;padding:0 4px}
  .sp.cl{padding-left:9px}
  .cd{overflow:visible}
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">My Dashboard</div>
  <nav id="nav"></nav>
</div></header>
<main id="page"></main>

<script>
var PAGES=["Today","Tasks","Calendar","Time","Money","Portfolio","Settings"];
var LATER={Calendar:"Your appointments and weekly schedule will live here.",
Time:"Quick add for Anki, studying, martial arts, work, eating, sleep and other, with graphs.",
Money:"Quick add for income and costs, with monthly totals and graphs.",
Portfolio:"Your Trade Republic and Smartbroker+ holdings, with profit and loss.",
Settings:"Your reminder note, categories, backup and export buttons will live here."};
var DEFAULT_NOTE="Log today's costs and income.";

function getNote(){try{return localStorage.getItem("reminderNote")||DEFAULT_NOTE}catch(e){return DEFAULT_NOTE}}
function saveNote(v){try{localStorage.setItem("reminderNote",v);return true}catch(e){return false}}

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("Could not save. Open this file in Chrome or Edge.");return false}}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayStr(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function addMonth(s){var d=new Date(s+"T12:00:00"),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);var m=d.getMonth();d.setDate(day);if(d.getMonth()!==m)d.setDate(0);return iso(d)}
var RANK={High:0,Medium:1,Low:2};
function sortTasks(a,b){return RANK[a.prio]-RANK[b.prio]||(a.due||"9999").localeCompare(b.due||"9999")}
function repLabel(t){return t.rep==="week"?"repeats weekly":t.rep==="month"?"repeats monthly":t.rep==="after"?"repeats "+t.n+" days after done":""}
function niceDate(s){return s?new Date(s+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"No deadline"}
function taskRow(t,full){
  var od=!t.done&&t.due&&t.due<todayStr();
  return '<li class="'+(od?"over":"")+'"><input type="checkbox" data-id="'+t.id+'" aria-label="Mark done: '+esc(t.title)+'"'+(t.done?" checked":"")+'>'+
  '<div class="tt">'+esc(t.title)+'<div class="meta">'+(od?"Overdue: ":"")+niceDate(t.due)+(repLabel(t)&&full?" · "+repLabel(t):"")+'</div></div>'+
  '<span class="pill '+t.prio+'">'+t.prio+'</span>'+(full?'<button class="x" data-del="'+t.id+'" aria-label="Delete task">Delete</button>':"")+'</li>'}
function toggle(id){
  var ts=load("tasks"),t=ts.filter(function(x){return x.id==id})[0];if(!t)return;
  t.done=!t.done;
  if(t.done&&t.rep&&t.rep!=="none"&&!t.spawned){
    var nd=t.rep==="week"?addDays(t.due||todayStr(),7):t.rep==="month"?addMonth(t.due||todayStr()):addDays(todayStr(),t.n);
    ts.push({id:Date.now(),title:t.title,due:nd,prio:t.prio,rep:t.rep,n:t.n,done:false});t.spawned=true}
  save("tasks",ts);render()}
function tasksPage(){
  var ts=load("tasks"),open=ts.filter(function(t){return!t.done}).sort(sortTasks),done=ts.filter(function(t){return t.done});
  var h='<h1>Tasks</h1><p class="sub">Highest priority first, then by deadline. Tick a task to finish it. Repeating tasks create their next copy automatically.</p>'+
  '<form class="form" id="tf"><label class="t">Task<input id="tt" required maxlength="120"></label>'+
  '<label>Deadline<input type="date" id="td"></label>'+
  '<label>Priority<select id="tp"><option>High</option><option selected>Medium</option><option>Low</option></select></label>'+
  '<label>Repeat<select id="tr"><option value="none">Never</option><option value="week">Every week</option><option value="month">Every month</option><option value="after">Days after I finish</option></select></label>'+
  '<label id="tnl" hidden>Days<input type="number" id="tn" min="1" value="7" style="width:70px"></label>'+
  '<button type="submit">Add task</button></form>';
  h+='<section class="card">'+(open.length?'<ul class="tasks">'+open.map(function(t){return taskRow(t,1)}).join("")+'</ul>':'<p class="empty">No open tasks. Add your first one above.</p>')+'</section>';
  if(done.length)h+='<h3>Done</h3><section class="card done"><ul class="tasks">'+done.map(function(t){return taskRow(t,1)}).join("")+'</ul></section>';
  return h}
function bindTasks(){
  var f=document.getElementById("tf");
  if(f){document.getElementById("tr").onchange=function(){document.getElementById("tnl").hidden=this.value!=="after"};
    f.onsubmit=function(e){e.preventDefault();var ts=load("tasks");
      ts.push({id:Date.now(),title:document.getElementById("tt").value.trim(),due:document.getElementById("td").value,prio:document.getElementById("tp").value,rep:document.getElementById("tr").value,n:Math.max(1,parseInt(document.getElementById("tn").value)||7),done:false});
      if(save("tasks",ts))render()}}
  document.querySelectorAll("input[data-id]").forEach(function(c){c.onchange=function(){toggle(c.dataset.id)}});
  document.querySelectorAll("button[data-del]").forEach(function(b){b.onclick=function(){save("tasks",load("tasks").filter(function(t){return t.id!=b.dataset.del}));render()}})}
function todoCard(){
  var open=load("tasks").filter(function(t){return!t.done}).sort(sortTasks),td=todayStr();
  var over=open.filter(function(t){return t.due&&t.due<td}).length,dueT=open.filter(function(t){return t.due===td}).length;
  if(!open.length)return '<section class="card"><h2>To-do</h2><p class="empty">No open tasks. <a href="#Tasks">Add one</a>.</p></section>';
  return '<section class="card"><h2>To-do</h2><p class="meta">'+over+' overdue · '+dueT+' due today · '+open.length+' open</p><ul class="tasks">'+open.slice(0,5).map(function(t){return taskRow(t,0)}).join("")+'</ul></section>'}

var calView="month",calAnchor=todayStr();
function loadA(){return load("appts")}
function isSpan(a){return!!(a.until&&a.until>a.date)}
function occurs(a,day){
  if(isSpan(a))return day>=a.date&&day<=a.until;
  if(day<a.date)return false;
  if(!a.rep||a.rep==="none")return day===a.date;
  if(a.rep==="week")return Math.round((new Date(day+"T12:00:00")-new Date(a.date+"T12:00:00"))/864e5)%7===0;
  return day.slice(8)===a.date.slice(8)}
function apptsOn(day){return loadA().filter(function(a){return occurs(a,day)}).sort(function(a,b){return (a.start||"").localeCompare(b.start||"")})}
function tasksOn(day){return load("tasks").filter(function(t){return!t.done&&t.due===day})}
function weekStart(s){var d=new Date(s+"T12:00:00");return addDays(s,-((d.getDay()+6)%7))}
function apptLabel(a){return (a.start?a.start+(a.end?"-"+a.end:"")+" ":"")+a.title}
function calPage(){
  var d=new Date(calAnchor+"T12:00:00"),days=[],title;
  if(calView==="week"){var ws=weekStart(calAnchor);for(var i=0;i<7;i++)days.push(addDays(ws,i));
    title=niceDate(days[0])+" to "+niceDate(days[6])}
  else{var first=iso(new Date(d.getFullYear(),d.getMonth(),1)),st=weekStart(first),m=d.getMonth();
    for(var j=0;j<42;j++){var x=addDays(st,j);if(j>=35&&new Date(x+"T12:00:00").getMonth()!==m)break;days.push(x)}
    title=d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}
  var td=todayStr(),mon=d.getMonth();
  var spans=loadA().filter(function(a){return isSpan(a)&&a.date<=days[days.length-1]&&a.until>=days[0]}).sort(function(a,b){return a.date.localeCompare(b.date)||b.until.localeCompare(a.until)||a.id-b.id}),laneEnd=[],lane={};
  spans.forEach(function(a){var L=0;while(laneEnd[L]&&laneEnd[L]>=a.date)L++;laneEnd[L]=a.until;lane[a.id]=L});
  function spanRows(x,i){
    var act=spans.filter(function(a){return a.date<=x&&a.until>=x});if(!act.length)return "";
    var mxl=Math.max.apply(null,act.map(function(a){return lane[a.id]})),out="";
    for(var L=0;L<=mxl;L++){
      var a=act.filter(function(e){return lane[e.id]===L})[0];
      if(a&&(a.date===x||i%7===0)){
        var n=0,rowEnd=i-i%7+6;
        for(var k=i;k<=rowEnd&&k<days.length&&days[k]<=a.until;k++)n++;
        var cl=a.date<x,cr=a.until>days[i+n-1],tip=a.title+" ("+niceDate(a.date)+" to "+niceDate(a.until)+(a.start?", "+a.start+(a.end?"-"+a.end:""):"")+")";
        out+='<div class="sp'+(cl?" cl":"")+(cr?" cr":"")+'" style="width:calc('+n+'*100% + '+((n-1)*9+(cl?5:0)+(cr?5:0))+'px)" title="'+esc(tip)+'">'+esc(a.title)+'</div>'
      }else out+='<div class="sp0"></div>'
    }
    return out}
  var h='<h1>Calendar</h1><p class="sub">Appointments and task deadlines in one place.</p>'+
  '<form class="form" id="af"><label class="t">Appointment<input id="at" required maxlength="120"></label>'+
  '<label>Date<input type="date" id="ad" value="'+td+'" required></label><label>Until (optional)<input type="date" id="au"></label>'+
  '<label>Start<input type="time" id="as"></label><label>End<input type="time" id="ae"></label>'+
  '<label>Repeat<select id="ar"><option value="none">Never</option><option value="week">Every week</option><option value="month">Every month</option></select></label>'+
  '<button type="submit">Add appointment</button></form>'+
  '<div class="tools"><h2>'+title+'</h2><div class="seg"><button class="alt'+(calView==="week"?" sel":"")+'" data-v="week">Week</button><button class="alt'+(calView==="month"?" sel":"")+'" data-v="month">Month</button></div>'+
  '<div class="seg"><button class="alt" data-n="-1" aria-label="Previous">&lsaquo; Prev</button><button class="alt" data-n="0">Today</button><button class="alt" data-n="1" aria-label="Next">Next &rsaquo;</button></div></div>'+
  '<div class="cal"><div class="cg">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(n){return '<div class="ch">'+n+'</div>'}).join("");
  days.forEach(function(x,idx){

function armed(b,fn,label){var t=b.textContent;b.onclick=function(){if(b.dataset.a){fn();return}b.dataset.a="1";b.textContent=label||"Tap again to confirm";setTimeout(function(){b.dataset.a="";b.textContent=t},4000)}}
var PFC=["#0E7C86","#3B6FB6","#B5532A","#7A5BB0","#C58A00","#4C5D8A","#2E8B57","#A33B6B","#8A9AA3"],pfPie="inv";
function pfTot(hs){var v=0,p=0;hs.forEach(function(h){v+=h.now;p+=h.paid});return{v:v,p:p,pl:v-p,pct:p?(v-p)/p*100:0}}
function fpl(n){return (n>0?"+":"")+fe(n)}
function fpct(n){return (n>0?"+":"")+(Math.round(n*10)/10)+"%"}
function plCls(n){return n<0?"neg":n>0?"pos":""}
function snapPf(){var t=pfTot(load("pf")),ss=load("psnap").filter(function(x){return x.date!==todayStr()});ss.push({date:todayStr(),v:t.v,p:t.p});save("psnap",ss)}
function lineChart(ss){
  if(!ss.length)return '<p class="empty">Add or update an investment and the graph starts here.</p>';
  ss=ss.slice().sort(function(a,b){return a.date.localeCompare(b.date)});
  var vals=[];ss.forEach(function(x){vals.push(x.v);if(typeof x.p==="number")vals.push(x.p)});
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}
  var pad=(hi-lo)*0.1;hi+=pad;lo=Math.max(0,lo-pad);
  var t0=new Date(ss[0].date).getTime(),t1=new Date(ss[ss.length-1].date).getTime();
  function X(d){return ss.length===1?160:44+(new Date(d).getTime()-t0)/((t1-t0)||1)*266}
  function Y(v){return 118-(v-lo)/(hi-lo)*100}
  var vp=ss.map(function(x){return X(x.date).toFixed(1)+","+Y(x.v).toFixed(1)}).join(" "),
  pp=ss.filter(function(x){return typeof x.p==="number"}).map(function(x){return X(x.date).toFixed(1)+","+Y(x.p).toFixed(1)}).join(" ");
  var svg='<svg viewBox="0 0 320 150" width="100%" role="img" aria-label="Portfolio value over time"><line x1="44" y1="118" x2="316" y2="118" stroke="#D5E0E5"/><line x1="44" y1="18" x2="316" y2="18" stroke="#EAF0F2"/>'+
  '<text x="2" y="21" font-size="9" fill="#5B6F7A">'+fe(Math.round(hi))+'</text><text x="2" y="121" font-size="9" fill="#5B6F7A">'+fe(Math.round(lo))+'</text>';
  if(pp&&ss.length>1)svg+='<polyline points="'+pp+'" fill="none" stroke="#8A9AA3" stroke-width="2" stroke-dasharray="5 4"/>';
  if(ss.length>1)svg+='<polyline points="'+vp+'" fill="none" stroke="#0E7C86" stroke-width="2.5"/>';
  ss.forEach(function(x){svg+='<circle cx="'+X(x.date).toFixed(1)+'" cy="'+Y(x.v).toFixed(1)+'" r="3.5" fill="#0E7C86"/>'});
  svg+='<text x="44" y="136" font-size="9" fill="#5B6F7A">'+niceDate(ss[0].date)+'</text>'+(ss.length>1?'<text x="316" y="136" font-size="9" text-anchor="end" fill="#5B6F7A">'+niceDate(ss[ss.length-1].date)+'</text>':'')+'</svg>';
  return svg+'<p class="meta"><span class="sw" style="background:#0E7C86;display:inline-block"></span> Value &nbsp; <span class="sw" style="background:#8A9AA3;display:inline-block"></span> Paid in. Latest: '+fe(ss[ss.length-1].v)+(ss.length===1?'. Update your values on other days to see the line.':'')+'</p>'}

function barChart(groups,series,mode,fmt){

  var mx=0;groups.forEach(function(g){var v=mode==="stack"?g.values.reduce(function(a,b){return a+b},0):Math.max.apply(null,g.values);if(v>mx)mx=v});
  var anyRest=groups.some(function(g){return g.rest});if(!mx&&!anyRest)return '<p class="empty">Nothing to show yet. Add some entries first.</p>';if(!mx)mx=1;
  var gw=pw/n,svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Bar chart"><line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-4)+'" y2="'+(T+ph)+'" stroke="#D5E0E5"/>'+
  '<text x="2" y="'+(T+8)+'" font-size="9" fill="#5B6F7A">'+fmt(mx)+'</text><text x="2" y="'+(T+ph)+'" font-size="9" fill="#5B6F7A">0</text>';
  groups.forEach(function(g,i){var x0=L+i*gw+gw*0.15,bw=gw*0.7;
    if(mode==="stack"){if(g.tip)svg+='<rect x="'+x0.toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+ph+'" fill="transparent"><title>'+esc(g.tip)+'</title></rect>';var y=T+ph;g.values.forEach(function(v,k){if(v<=0)return;var hh=v/mx*ph;y-=hh;svg+='<rect x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+series[k].color+'"><title>'+esc(series[k].label)+': '+fmt(v)+(g.notes&&g.notes[k]?"\n"+esc(g.notes[k]):"")+'</title></rect>'});if(g.rest)svg+='<rect x="'+x0.toFixed(1)+'" y="'+(T+ph+2)+'" width="'+bw.toFixed(1)+'" height="4" rx="2" fill="#7FB3A0"><title>'+esc(g.tip||"Rest day")+'</title></rect>'}
    else{var sw=bw/g.values.length;g.values.forEach(function(v,k){var hh=v/mx*ph;svg+='<rect x="'+(x0+k*sw).toFixed(1)+'" y="'+(T+ph-hh).toFixed(1)+'" width="'+(sw-1).toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+series[k].color+'"><title>'+esc(series[k].label)+': '+fmt(v)+'</title></rect>'})}
    svg+='<text x="'+(L+i*gw+gw/2).toFixed(1)+'" y="'+(H-8)+'" font-size="8.5" text-anchor="middle" fill="#5B6F7A">'+esc(g.label)+'</text>'});
  return svg+'</svg><ul class="leg" style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px">'+series.map(function(x){return '<li><span class="sw" style="background:'+x.color+'"></span>'+esc(x.label)+'</li>'}).join("")+'</ul>'}

  document.querySelectorAll("button[data-pd]").forEach(function(b){b.onclick=function(){var n=+b.dataset.pd;pickDay=n===0?todayStr():addDays(pickDay,n);render()}});
  document.querySelectorAll("button[data-dr]").forEach(function(b){b.onclick=function(){dayRange=+b.dataset.dr;render()}});
  document.querySelectorAll("button[data-dn]").forEach(function(b){b.onclick=function(){dayNoSleep=!dayNoSleep;render()}});
  var dc=document.getElementById("dcat");if(dc)dc.onchange=function(){dayCat=dc.value;render()};
  document.querySelectorAll("button[data-trdel]").forEach(function(b){armed(b,function(){save("trules",load("trules").filter(function(r){return r.id!=b.dataset.trdel}));render()},"Tap again to stop")});
  document.querySelectorAll("button[data-tg]").forEach(function(b){b.onclick=function(){timeGran=b.dataset.tg;render()}});
  document.querySelectorAll("button[data-ns]").forEach(function(b){b.onclick=function(){timeNoSleep=!timeNoSleep;render()}})}
function moneyOverCard(){
  var cur=todayStr().slice(0,7),groups=[],lefts=[];
  for(var i=5;i>=0;i--){var ym=shiftMonth(cur,-i),m=monthSums(ym),lab=new Date(ym+"-01T12:00:00").toLocaleDateString("en-GB",{month:"short",year:"2-digit"});
    groups.push({label:lab,values:[m.inc,m.out]});lefts.push([lab,m.left])}
  return '<section class="card" style="margin-top:16px"><h2>Month by month</h2>'+barChart(groups,[{label:"Income",color:"#2E8B57"},{label:"Costs",color:"#B5532A"}],"group",fe)+
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:8px">'+lefts.map(function(l){return '<div class="meta">'+l[0]+'<br><b class="'+(l[1]<0?"neg":"")+'">Left: '+fe(l[1])+'</b></div>'}).join("")+'</div></section>'}

function today(){
  var d=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var cards=[["Portfolio","No investments added yet."],["Appointments","Nothing coming up."],
  ["Time logged today","No hours logged yet."],["Sleep","No sleep logged yet."],["Money this month","No income or costs yet."]];
  var h='<h1>Today</h1><p class="sub">'+d+'</p>'+backupLine()+'<div class="grid">';
  h+='<section class="card note"><h2>Reminder</h2><textarea id="note" aria-label="Reminder note"></textarea><p class="saved" id="saved"></p></section>';
  cards.forEach(function(c,i){if(i===1)h+=todoCard();if(c[0]==="Portfolio"){h+=pfCard();return}if(c[0]==="Appointments"){h+=apptCard();return}if(c[0]==="Time logged today"){h+=timeCard()+goalsProgress();return}if(c[0]==="Sleep"){h+=sleepCard();return}if(c[0]==="Money this month"){h+=moneyCard();return}h+='<section class="card"><h2>'+c[0]+'</h2><p class="empty">'+c[1]+'</p></section>'});
  return h+'</div>';
}
function later(p){return '<h1>'+p+'</h1><p class="sub">Not built yet.</p><section class="card later"><p class="empty">'+LATER[p]+'</p></section>'}

function render(){refreshCats();
  var p=decodeURIComponent(location.hash.slice(1));
  if(PAGES.indexOf(p)<0)p="Today";
  document.getElementById("nav").innerHTML=PAGES.map(function(n){
    return '<a href="#'+n+'"'+(n===p?' class="on" aria-current="page"':'')+'>'+n+'</a>'}).join("");
  document.getElementById("page").innerHTML=p==="Today"?today():p==="Tasks"?tasksPage():p==="Calendar"?calPage():p==="Settings"?settingsPage():p==="Time"?timePage():p==="Money"?moneyPage():p==="Portfolio"?portfolioPage():later(p);bindTasks();bindCal();bindSettings();bindTime();bindTimeGraph();bindGoals();bindMoney();bindPf();
  document.title=p+" - My Dashboard";
  if(p==="Today"){
    var t=document.getElementById("note");t.value=getNote();
    t.addEventListener("input",function(){
      document.getElementById("saved").textContent=saveNote(t.value)?"Saved":"Could not save. Open this file in Chrome or Edge."});
  }
}
window.addEventListener("hashchange",render);applyRules();applyTimeRules();render();
</script>
